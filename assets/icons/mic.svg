<svg xmlns="http://www.w3.org/2000/svg"
     width="80"
     height="80"
     viewBox="0 0 64 64">

    <defs>
        <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff2d2d"/>
            <stop offset="100%" stop-color="#b30000"/>
        </linearGradient>

        <filter id="shadow">
            <feDropShadow dx="0" dy="2" stdDeviation="2"
                flood-color="#ff2d2d" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Outer Circle -->
    <circle cx="32" cy="32" r="28"
            fill="#111827"
            stroke="#2D3748"
            stroke-width="2"/>

    <!-- Microphone -->
    <g filter="url(#shadow)">
        <rect x="24"
              y="12"
              width="16"
              height="24"
              rx="8"
              fill="url(#micGrad)"/>

        <path d="M20 30
                 C20 38 25 43 32 43
                 C39 43 44 38 44 30"
              fill="none"
              stroke="#ffffff"
              stroke-width="3"
              stroke-linecap="round"/>

        <line x1="32" y1="43"
              x2="32" y2="50"
              stroke="#ffffff"
              stroke-width="3"
              stroke-linecap="round"/>

        <line x1="26" y1="50"
              x2="38" y2="50"
              stroke="#ffffff"
              stroke-width="3"
              stroke-linecap="round"/>
    </g>

</svg>